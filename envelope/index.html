<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>دعوة خاصة</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;600&display=swap">
<style>
  /* ١) الألوان: غيّريها كما تحبين */
  :root{
    --page:#e9ece6;      /* خلفية الصفحة */
    --env:#8fa89a;       /* لون المغلف */
    --env-dark:#7a9486;  /* ظل المغلف */
    --letter:#fffdf8;    /* لون البطاقة */
    --seal:#8c2f39;      /* لون الختم */
    --ink:#2b2f2c;       /* لون الكتابة */
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;gap:24px;
       background:var(--page);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;color:var(--ink)}

  /* ٢) جسم المغلف */
  .envelope{position:relative;width:min(320px,86vw);aspect-ratio:3/2;
            background:var(--env-dark);border-radius:6px;cursor:pointer;perspective:900px;
            margin-top:120px}

  /* ٣) البطاقة داخل المغلف */
  .letter{position:absolute;inset:6% 5% 6%;background:var(--letter);border-radius:4px;
          padding:14px;text-align:center;z-index:1;
          transition:transform .6s ease .5s;box-shadow:0 2px 6px rgba(0,0,0,.12)}
  .letter h1{font-family:"Reem Kufi",sans-serif;font-size:22px;margin:4px 0}
  .letter p{margin:4px 0;font-size:14px}

  /* ٤) الجيب الأمامي (مثلثات اليمين واليسار والأسفل) */
  .pocket{position:absolute;inset:0;background:var(--env);border-radius:6px;z-index:2;
          clip-path:polygon(0 0,50% 58%,100% 0,100% 100%,0 100%)}

  /* ٥) الغطاء العلوي الذي ينقلب */
  .flap{position:absolute;inset:0;background:var(--env-dark);z-index:3;
        clip-path:polygon(0 0,100% 0,50% 62%);
        transform-origin:top;transition:transform .5s ease,z-index 0s .25s}

  /* ٦) الختم */
  .seal{position:absolute;top:52%;left:50%;width:46px;height:46px;margin:-23px;border-radius:50%;
        background:var(--seal);color:#fff;display:grid;place-items:center;
        font-family:"Reem Kufi",sans-serif;z-index:4;transition:opacity .3s, transform .3s;
        box-shadow:0 2px 0 rgba(0,0,0,.2)}

  /* ٧) حالة الفتح: هنا السحر كله */
  .envelope.open .flap{transform:rotateX(180deg);z-index:0}
  .envelope.open .seal{opacity:0;transform:scale(.6)}
  .envelope.open .letter{transform:translateY(-62%)}

  .hint{font-size:14px;opacity:.7}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
  <div class="envelope" id="env" role="button" tabindex="0" aria-label="افتح المغلف">
    <div class="letter">
      <p>يسعدنا دعوتكم</p>
      <h1 id="guest">لحضور حفلنا</h1>
      <p>الخميس ١٢ ديسمبر · الساعة ٨ مساءً</p>
    </div>
    <div class="pocket"></div>
    <div class="flap"></div>
    <div class="seal">ن</div>
  </div>
  <p class="hint" id="hint">اضغط على المغلف لفتحه</p>

<script>
  // ٨) الفتح والإغلاق بالضغط
  const env = document.getElementById('env');
  const hint = document.getElementById('hint');
  function toggle(){
    env.classList.toggle('open');
    hint.textContent = env.classList.contains('open') ? 'اضغط مرة ثانية لإغلاقه' : 'اضغط على المغلف لفتحه';
  }
  env.addEventListener('click', toggle);
  env.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } });

  // ٩) اسم الضيف من الرابط:  index.html?name=سارة
  const name = new URLSearchParams(location.search).get('name');
  if (name) document.getElementById('guest').textContent = 'أهلاً ' + name;
</script>
</body>
</html>
